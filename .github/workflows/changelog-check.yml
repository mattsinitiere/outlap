name: Changelog check

# Any push or pull request that changes code must also update CHANGELOG.md.
# Commits that only touch web/data (like the weekly refresh) are exempt.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "First push, nothing to compare."; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          code=$(echo "$changed" | grep -v '^web/data/' | grep -v '^CHANGELOG.md$' | grep -v '^$' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
            echo "These files changed without a CHANGELOG.md entry:"; echo "$code"
            echo "Add an entry under [Unreleased] describing the change."
            exit 1
          fi
          echo "Changelog check passed."
