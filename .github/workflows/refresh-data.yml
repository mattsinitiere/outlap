name: Refresh race data

# Two schedules, one job:
#  - Every 3 hours, a quick check (ingest/check_new.py) compares this season's data
#    with Jolpica and looks for recent races missing OpenF1 telemetry. Only if
#    something is new does it rebuild the current season. Most runs stop after the check.
#  - Every Monday, and on demand, a full refresh: current season plus photos, logos,
#    new circuits and Wikipedia info.
# A commit is made only when real data changed (a new timestamp alone doesn't count),
# and Vercel redeploys automatically from the push.
on:
  schedule:
    - cron: "17 */3 * * *"   # check for new data
    - cron: "0 10 * * 1"     # weekly full refresh
  workflow_dispatch:
    inputs:
      since:
        description: "First season to rebuild (blank = current season; 2023 backfills all OpenF1 telemetry)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide what to run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 10 * * 1" ]; then
            echo "Full refresh."; echo "run=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python ingest/check_new.py
          if grep -q '^new=true$' "$GITHUB_OUTPUT"; then echo "run=season" >> "$GITHUB_OUTPUT"
          else echo "run=none" >> "$GITHUB_OUTPUT"; fi
      - if: steps.plan.outputs.run != 'none'
        run: pip install requests==2.32.3 "numpy>=1.26,<3"
      - name: Build current season
        if: steps.plan.outputs.run != 'none'
        env:
          SINCE: ${{ inputs.since }}
        run: |
          case "$SINCE" in
            "") SINCE=$(date +%Y) ;;
            20[0-9][0-9]) ;;
            *) echo "since must be a year like 2023"; exit 1 ;;
          esac
          python ingest/build_data.py --since "$SINCE"
      - name: Photos and logos
        if: steps.plan.outputs.run == 'full'
        run: python ingest/media.py
      - name: New circuits (existing ones are kept)
        if: steps.plan.outputs.run == 'full'
        run: python ingest/circuits.py
      - name: Bios, team facts and car specs for anything new
        if: steps.plan.outputs.run == 'full'
        run: python ingest/wiki_info.py
      - name: Commit data
        if: steps.plan.outputs.run != 'none'
        run: |
          # meta.json gets a fresh timestamp on every run; keep it only alongside real changes
          if [ -z "$(git status --porcelain web/data | grep -v 'web/data/meta.json$')" ]; then
            git checkout -- web/data/meta.json 2>/dev/null || true
            echo "No data changes."; exit 0
          fi
          git config user.name "outlap-bot"
          git config user.email "outlap-bot@users.noreply.github.com"
          git add web/data
          git commit -m "Data refresh $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
