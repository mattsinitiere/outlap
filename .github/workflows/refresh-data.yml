name: Refresh race data

# Two schedules, one job (news, videos and social posts refresh on every run):
#  - Every 3 hours, a quick check (ingest/check_new.py) compares this season's data
#    with Jolpica and looks for recent races missing OpenF1 telemetry. Only if
#    something is new does it rebuild the current season. Most runs stop after the check.
#  - Every Monday, and on demand, a full refresh: current season plus photos, logos,
#    new circuits and Wikipedia info.
# Every run also fetches lap-by-lap data (ingest/laps.py) for any race that lacks it. The first
# backfill of every race since 2018 needs several runs because Jolpica allows about 500 requests
# an hour; after that it only picks up new races.
# A commit is made only when real data changed (a new timestamp alone doesn't count),
# and Vercel redeploys automatically from the push. If the season build runs out of
# time, whatever finished is still committed and the next run carries on from there.
on:
  schedule:
    - cron: "17 */3 * * *"   # check for new data
    - cron: "0 10 * * 1"     # weekly full refresh
  workflow_dispatch:
    inputs:
      since:
        description: "First season to rebuild (blank = current season; 2023 backfills all OpenF1 telemetry)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide what to run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 10 * * 1" ]; then
            echo "Full refresh."; echo "run=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python ingest/check_new.py
          if grep -q '^new=true$' "$GITHUB_OUTPUT"; then echo "run=season" >> "$GITHUB_OUTPUT"
          else echo "run=none" >> "$GITHUB_OUTPUT"; fi
      - if: steps.plan.outputs.run != 'none'
        run: pip install requests==2.32.3 "numpy>=1.26,<3"
      - name: Build seasons
        if: steps.plan.outputs.run != 'none'
        timeout-minutes: 240
        continue-on-error: true
        env:
          SINCE: ${{ inputs.since }}
        run: |
          case "$SINCE" in
            "") SINCE=$(date +%Y) ;;
            20[0-9][0-9]) ;;
            *) echo "since must be a year like 2023"; exit 1 ;;
          esac
          python -u ingest/build_data.py --since "$SINCE"
      - name: Lap-by-lap data (resumable, standard library only)
        if: always()
        timeout-minutes: 95
        continue-on-error: true
        run: python -u ingest/laps.py --minutes ${{ steps.plan.outputs.run == 'full' && '25' || '85' }}
      - name: Photos and logos
        if: always() && steps.plan.outputs.run == 'full'
        timeout-minutes: 40
        continue-on-error: true
        run: python -u ingest/media.py
      - name: New circuits (existing ones are kept)
        if: always() && steps.plan.outputs.run == 'full'
        timeout-minutes: 20
        continue-on-error: true
        run: python -u ingest/circuits.py
      - name: Bios, team facts and car specs for anything new
        if: always() && steps.plan.outputs.run == 'full'
        timeout-minutes: 20
        continue-on-error: true
        run: python -u ingest/wiki_info.py
      - name: News, videos and social posts
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        run: python -u ingest/news.py
      - name: Commit data
        if: always()
        run: |
          # meta.json gets a fresh timestamp on every run; keep it only alongside real changes
          changed=$(git status --porcelain web/data | grep -v 'web/data/meta.json$' || true)
          if [ -z "$changed" ]; then
            git checkout -- web/data/meta.json 2>/dev/null || true
            echo "No data changes."; exit 0
          fi
          git config user.name "outlap-bot"
          git config user.email "outlap-bot@users.noreply.github.com"
          git add web/data
          if echo "$changed" | grep -qv 'web/data/news'; then msg="Data refresh"; else msg="News refresh"; fi
          git commit -m "$msg $(date -u '+%F %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
